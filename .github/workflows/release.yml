name: Release

# Tag a release to trigger: `git tag v0.2.1 && git push --tags`
# awab is a Linux tool, so releases ship static (musl) Linux binaries only.
# For macOS/Windows, build from source: `cargo install --git <repo> awab-cli`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  cross: false }
          - { target: aarch64-unknown-linux-musl, cross: true  }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.cross == false
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cargo)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} -p awab-cli

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p awab-cli

      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/awab
          name="awab-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "$bin" "$name"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            awab-*.tar.gz
            awab-*.tar.gz.sha256
