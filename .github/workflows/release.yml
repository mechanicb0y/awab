name: Release

# Tag a release to trigger: `git tag v0.1.0 && git push --tags`
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  cross: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, cross: true  }
          - { os: macos-latest,   target: x86_64-apple-darwin,        cross: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, 'linux-musl') && matrix.cross == false
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cargo)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} -p awab-cli

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p awab-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/awab
          name="awab-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "$bin" "$name"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/awab.exe
          name="awab-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "$bin" "$name"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          7z a "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            awab-*.tar.gz
            awab-*.tar.gz.sha256
            awab-*.zip
            awab-*.zip.sha256
