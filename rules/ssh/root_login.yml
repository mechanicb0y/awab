id: awab-ssh-root-login
title: Successful SSH login as root
description: >
  An interactive SSH session was accepted directly for the root account.
  Direct root login over SSH is widely discouraged; investigate whether it is
  expected from this source.
author: awab
level: medium
references:
  - https://attack.mitre.org/techniques/T1021/004/
mitre:
  tactic: lateral-movement
  technique: T1021.004
logsource:
  parser: syslog
  service: sshd
detection:
  selection:
    event_type: auth_success
    user: root
