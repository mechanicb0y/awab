id: awab-ssh-password-spray
title: SSH password spray
description: >
  A single source IP attempted failed logins against many distinct usernames
  in a short window — the signature of a password-spraying attack (few guesses
  across many accounts, rather than many guesses against one).
author: awab
level: high
references:
  - https://attack.mitre.org/techniques/T1110/003/
mitre:
  tactic: credential-access
  technique: T1110.003
logsource:
  parser: syslog
  service: sshd
detection:
  selection:
    event_type: auth_failure
  group_by: source_ip
  timewindow: 300s
  threshold: 5
  count_distinct: user
