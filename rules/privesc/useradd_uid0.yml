id: awab-useradd-uid0
title: New account created with UID 0
description: >
  A new user account was created with UID 0, giving it root-equivalent
  privileges. Legitimate systems almost never have a second UID-0 account;
  this is a classic persistence/backdoor technique.
author: awab
level: critical
references:
  - https://attack.mitre.org/techniques/T1136/001/
mitre:
  tactic: persistence
  technique: T1136.001
logsource:
  parser: syslog
  service: useradd
detection:
  selection:
    event_type: user_add
    uid: "0"
