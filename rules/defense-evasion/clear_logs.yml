id: awab-clear-logs
title: System log deletion or truncation
description: >
  A command deleted, truncated, or vacuumed system logs under /var/log or the
  journal. Wiping logs is a classic anti-forensics step to destroy evidence of
  an intrusion.
author: awab
level: high
references:
  - https://attack.mitre.org/techniques/T1070/002/
mitre:
  tactic: defense-evasion
  technique: T1070.002
detection:
  selection:
    command|re: '(rm |shred |truncate ).*/var/log|> */var/log/|journalctl .*--(vacuum|rotate)'
